[project]
name = "client-intel"
version = "0.1.0"
description = "Client intelligence agent: a cited briefing for a sales rep from contract, usage, support, CRM and meeting-note data"
authors = [
    { name = "shardulkulkarni14", email = "shardul.ask@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.163.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
client-intel = "client_intel.cli:main"
client-intel-api = "client_intel.api:serve"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
